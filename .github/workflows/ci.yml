name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      # Flutter packages use the flutter tools; pure Dart packages (e.g. rubble_core) the dart tools.
      - name: analyze
        run: |
          if grep -q "sdk: flutter" pubspec.yaml; then flutter analyze --fatal-infos; else dart analyze --fatal-infos; fi
      - name: test
        run: |
          if grep -q "sdk: flutter" pubspec.yaml; then flutter test; else dart test; fi
